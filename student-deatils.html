<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Details</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <aside class="sidebar">

        <h2>StudentMS</h2>

        <nav>

            <a href="index.html">
                Dashboard
            </a>

            <a href="students.html">
                Students
            </a>

            <a href="add-student.html">
                Add Student
            </a>

        </nav>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <h1>Student Details</h1>

            <a href="students.html"
               class="btn">

                Back

            </a>

        </header>


        <section class="details-card">

            <div class="profile">

                <div class="avatar"
                     id="avatar">

                    S

                </div>

                <h2 id="detailName">
                    Student Name
                </h2>

                <p id="detailCourse">
                    Course
                </p>

            </div>


            <div class="details-grid">

                <div>
                    <strong>Student ID</strong>
                    <span id="detailId"></span>
                </div>

                <div>
                    <strong>Email</strong>
                    <span id="detailEmail"></span>
                </div>

                <div>
                    <strong>Phone</strong>
                    <span id="detailPhone"></span>
                </div>

                <div>
                    <strong>Gender</strong>
                    <span id="detailGender"></span>
                </div>

                <div>
                    <strong>Semester</strong>
                    <span id="detailSemester"></span>
                </div>

                <div>
                    <strong>Marks</strong>
                    <span id="detailMarks"></span>
                </div>

            </div>

        </section>

    </main>

</div>


<script src="js/storage.js"></script>
<script src="js/details.js"></script>

</body>
</html>
